<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.E.S. - Smart Expense & Group Bill Splitter</title>
    <meta name="description" content="Smart Expense Tracker, Multimodal OCR Receipt Parser, Group Bill Splitting, and UPI Settlements for Everyone." />
    <meta property="og:title" content="SmartSplitMate - Smart Expense & OCR Bill Splitter for Everyone" />
    <meta property="og:description" content="Track bills, scan receipts with AI OCR, and settle via UPI instantly for everyone." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('splitmate_dark_mode');
          if (stored === 'false') {
            document.documentElement.classList.remove('dark');
            document.body && document.body.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.body && document.body.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
